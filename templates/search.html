{% extends "base.html" %}
{% block title %}جستجو - ShopCRM{% endblock %}
{% block content %}
<h2 class="h3 mb-4"><i class="bi bi-search"></i> جستجوی پیشرفته</h2>

<!-- افزودن فیلتر -->
<div class="card shadow-sm mb-3">
  <div class="card-header bg-primary text-white">
    <i class="bi bi-plus-circle"></i> افزودن فیلتر
  </div>
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label small">ستون</label>
        <select id="filter-column" class="form-select"></select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">عملگر</label>
        <select id="filter-op" class="form-select">
          <option value="=">مساوی</option>
          <option value="like">شامل</option>
          <option value=">">بزرگتر</option>
          <option value="<">کوچکتر</option>
          <option value=">=">&gt;=</option>
          <option value="<=">&lt;=</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">مقدار</label>
        <input type="text" id="filter-value" class="form-control" placeholder="مقدار...">
      </div>
      <div class="col-md-2">
        <label class="form-label small">ترکیب</label>
        <select id="filter-logic" class="form-select">
          <option value="AND">AND</option>
          <option value="OR">OR</option>
          <option value="NOT">NOT</option>
        </select>
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-primary w-100" onclick="addFilter()">
          <i class="bi bi-plus-lg"></i> افزودن
        </button>
      </div>
    </div>

    <div id="active-filters" class="mt-3"></div>
  </div>
</div>

<!-- دکمه‌ها -->
<div class="d-flex gap-2 mb-3">
  <button type="button" class="btn btn-primary" onclick="doSearch()">
    <i class="bi bi-search"></i> جستجو
  </button>
  <button type="button" class="btn btn-outline-secondary" onclick="clearFilters()">
    <i class="bi bi-x-circle"></i> پاک کردن
  </button>
</div>

<!-- نتایج -->
<div id="results"></div>
{% endblock %}

{% block scripts %}
<script>
let filters = [];

// بارگذاری ستون‌ها
fetch('/api/columns')
  .then(r => r.json())
  .then(data => {
    document.getElementById('filter-column').innerHTML =
      data.map(c => `<option value="${c.id}">${c.name} (${c.type})</option>`).join('');
  })
  .catch(err => console.error('failed to load columns:', err));

function addFilter() {
  const sel = document.getElementById('filter-column');
  const colId = sel.value;
  const colName = sel.selectedOptions[0]?.textContent || '';
  const op = document.getElementById('filter-op').value;
  const value = document.getElementById('filter-value').value.trim();
  const logic = filters.length > 0 ? document.getElementById('filter-logic').value : 'AND';

  if (!colId || !value) {
    alert('ستون و مقدار رو پر کن');
    return;
  }

  filters.push({colId, colName, op, value, logic});
  document.getElementById('filter-value').value = '';
  renderFilters();
}

function removeFilter(i) {
  filters.splice(i, 1);
  if (filters.length > 0) filters[0].logic = 'AND';
  renderFilters();
}

function renderFilters() {
  const container = document.getElementById('active-filters');
  if (!filters.length) {
    container.innerHTML = '<span class="text-body-secondary small">هنوز فیلتری اضافه نشده</span>';
    return;
  }
  container.innerHTML = filters.map((f, i) => {
    const opLabel = f.op === 'like' ? 'شامل' : f.op;
    const logic = i > 0 ? `<strong>${f.logic}</strong> ` : '';
    return `<span class="badge text-bg-primary me-1 mb-1 fs-6">
      ${logic}${f.colName} ${opLabel} "${f.value}"
      <a href="#" onclick="removeFilter(${i});return false"
         class="text-white ms-1 text-decoration-none">✕</a>
    </span>`;
  }).join('');
}

function clearFilters() {
  filters = [];
  renderFilters();
  document.getElementById('results').innerHTML = '';
}

function doSearch() {
  fetch('/api/search-advanced', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({filters: filters}),
  })
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('results');
    if (!data.length) {
      container.innerHTML = '<div class="alert alert-info">موردی یافت نشد.</div>';
      return;
    }

    const rows = data.map(sale => {
      const info = Object.entries(sale.data)
        .map(([k, v]) => `<strong>${k}:</strong> ${v}`)
        .join('<br>');
      return `<tr>
        <td><span class="badge text-bg-secondary">#${sale.sale_id}</span></td>
        <td>${info}</td>
      </tr>`;
    }).join('');

    container.innerHTML = `
      <div class="alert alert-success">
        <strong>${data.length}</strong> نتیجه یافت شد
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-dark">
                <tr><th style="width:120px">شماره فروش</th><th>اطلاعات</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
  })
  .catch(err => {
    console.error('search error:', err);
    document.getElementById('results').innerHTML =
      '<div class="alert alert-danger">خطا در جستجو. دوباره تلاش کن.</div>';
  });
}
</script>
{% endblock %}
