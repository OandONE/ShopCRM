<!DOCTYPE html>
<html lang="fa" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود - ShopCRM</title>
  <link href="/static/vendor/bootstrap/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-body-tertiary">
<div class="container" style="max-width:420px;margin-top:8vh">
  <div class="card shadow">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="display-4">🔐</div>
        <h1 class="h4 mt-2">ورود ادمین</h1>
      </div>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="POST" action="/login">
        <div class="mb-3">
          <label class="form-label">نام کاربری</label>
          <input type="text" class="form-control" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button class="btn btn-primary w-100">ورود</button>
      </form>
      <div class="text-center mt-3">
        <a href="/" class="text-decoration-none">→ بازگشت به داشبورد</a>
      </div>
    </div>
  </div>
</div>
<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
