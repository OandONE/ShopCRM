<!DOCTYPE html>
<html lang="fa" dir="rtl" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShopCRM{% endblock %}</title>
    <link href="/static/vendor/bootstrap/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/vendor/vazirmatn/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">🛒 ShopCRM</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house"></i> داشبورد</a></li>
        <li class="nav-item"><a class="nav-link" href="/quick"><i class="bi bi-lightning-charge"></i> سریع</a></li>
        <li class="nav-item"><a class="nav-link" href="/full"><i class="bi bi-pencil-square"></i> کامل</a></li>
        <li class="nav-item"><a class="nav-link" href="/search"><i class="bi bi-search"></i> جستجو</a></li>
        <li class="nav-item"><a class="nav-link" href="/reports"><i class="bi bi-graph-up"></i> گزارش</a></li>
        <li class="nav-item"><a class="nav-link" href="/sales"><i class="bi bi-receipt"></i> فروش‌ها</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin"><i class="bi bi-gear"></i> ادمین</a></li>
        <li class="nav-item"><a class="nav-link" href="/backup"><i class="bi bi-hdd"></i> بک‌آپ</a></li>
      </ul>
      <button class="btn btn-outline-light btn-sm" onclick="toggleTheme()" title="تغییر تم">
        <i class="bi bi-moon-stars" id="theme-icon"></i>
      </button>
    </div>
  </div>
</nav>

<main class="container py-4">
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-body-secondary py-3 small">
    ShopCRM · نسخه Alpha · MIT
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-bs-theme', saved);
    updateIcon(saved);
})();
function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-bs-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', next);
    localStorage.setItem('theme', next);
    updateIcon(next);
}
function updateIcon(theme) {
    const el = document.getElementById('theme-icon');
    if (!el) return;
    el.className = theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
}
// persian font for dates
function formatJalali(iso) {
    if (!iso) return '';
    return new Intl.DateTimeFormat('fa-IR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
    }).format(new Date(iso));
}
document.querySelectorAll('[data-timestamp]').forEach(el => {
    el.textContent = formatJalali(el.dataset.timestamp);
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
