{% extends "base.html" %}
{% block title %}تغییر رمز - ShopCRM{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <i class="bi bi-key"></i> تغییر رمز عبور
      </div>
      <div class="card-body">
        {% if msg == 'ok' %}
        <div class="alert alert-success"><i class="bi bi-check-circle"></i> رمز با موفقیت تغییر کرد.</div>
        {% endif %}
        {% if err %}
        <div class="alert alert-danger">{{ err }}</div>
        {% endif %}
        <form method="POST" action="/me/password">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label">رمز فعلی</label>
            <input type="password" class="form-control" name="current_password" required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label">رمز جدید</label>
            <input type="password" class="form-control" name="new_password" required minlength="4" autocomplete="new-password">
            <div class="form-text">حداقل ۴ کاراکتر</div>
          </div>
          <div class="mb-3">
            <label class="form-label">تکرار رمز جدید</label>
            <input type="password" class="form-control" name="confirm_password" required minlength="4" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> ذخیره</button>
          <a href="/" class="btn btn-outline-secondary">انصراف</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
